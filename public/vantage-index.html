<!DOCTYPE html>
<html lang="en" class="motion-pending">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <title>Stop Digging Through Dashboards</title>
  <script>
    document.documentElement.classList.add("motion-pending");
    window.__vantageMotionFallback = window.setTimeout(function () {
      document.documentElement.classList.remove("motion-pending");
    }, 3500);
  </script>
  <style>
    @font-face {
      font-family: "Reference Sans";
      src: url("./assets/instrument-sans.woff2") format("woff2-variations"),
           url("./assets/instrument-sans.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Reference Display";
      src: url("./assets/instrument-sans.woff2") format("woff2-variations"),
           url("./assets/instrument-sans.woff2") format("woff2");
      font-weight: 400 900;
      font-style: normal;
      font-display: swap;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color-scheme: dark;
    }

    :root {
      font-family: "Reference Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button,
    a {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    button {
      appearance: none;
      border: 0;
      background: none;
      padding: 0;
    }

    a {
      text-decoration: none;
    }

    img,
    video,
    svg {
      display: block;
      max-width: 100%;
    }

    .viewport {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background: #000;
    }

    .screen {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;

      --gutter-start: clamp(36px, 4.177vw, 96px);
      --gutter-end: clamp(36px, 4.04vw, 96px);
      --header-top: clamp(20px, 2.264vh, 30px);
      --hero-bottom: clamp(34px, 5.19vh, 64px);
      --display-size: clamp(58px, 7.64vh, 88px);
      --display-leading: clamp(72px, 9.34vh, 106px);
      --copy-size: clamp(14px, 1.70vh, 19px);
      --copy-leading: clamp(19px, 2.17vh, 24px);
      --title-copy-gap: clamp(15px, 2.08vh, 24px);
      --copy-cta-gap: clamp(24px, 3.11vh, 36px);
      --cta-width: clamp(142px, 15.09vh, 168px);
      --cta-height: clamp(38px, 3.96vh, 44px);
      --compact-control-font-size: clamp(17px, 1.75vh, 19px);
      --action-control-font-size: clamp(17px, 1.78vh, 19.5px);
      --primary-control-font-size: clamp(17px, 1.77vh, 19.25px);
      --control-inline-nudge: -1px;
      --control-baseline-shift: clamp(1px, .19vh, 2px);
      --copy-optical-shift: clamp(0px, .1vh, 1px);
      --watch-baseline-shift: clamp(2px, .38vh, 4px);
      --card-width: clamp(150px, 18.96vh, 215px);
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .03), transparent 24%, transparent 82%, rgba(0, 0, 0, .05)),
        radial-gradient(ellipse at 44% 54%, transparent 30%, rgba(0, 0, 0, .055) 100%);
    }

    .background {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
    }

    .header {
      position: absolute;
      inset: var(--header-top) var(--gutter-end) auto var(--gutter-start);
      height: 48px;
      display: flex;
      align-items: flex-start;
      white-space: nowrap;
      z-index: 20;
    }

    .brand {
      position: relative;
      top: 10px;
      width: 25px;
      height: 25px;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .3));
    }

    .brand svg {
      width: 25px;
      height: 25px;
    }

    .header-actions {
      display: flex;
      align-items: flex-start;
      min-width: 0;
      flex: 1;
    }

    .nav {
      display: flex;
      align-items: center;
      margin-left: clamp(36px, 3.03vw, 48px);
      gap: clamp(32px, 2.9vw, 43px);
      position: relative;
      top: 9px;
    }

    .nav a {
      position: relative;
      font-size: 16px;
      font-weight: 430;
      letter-spacing: -.36px;
      color: rgba(229, 229, 230, .77);
      text-shadow: 0 1px 3px rgba(0, 0, 0, .55);
    }

    .nav a:first-child {
      top: -3px;
    }

    .nav a:nth-child(4) {
      margin-left: 1px;
    }

    .nav a.active {
      color: #fff;
    }

    .nav a.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 44px;
      height: 2px;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, .82);
      border-radius: 2px;
    }

    .time-panel {
      margin-left: auto;
      width: 211px;
      height: 48px;
      padding-left: 8px;
      border-left: 2px solid rgba(230, 230, 230, .52);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .time-panel .label {
      font-size: 15px;
      font-weight: 420;
      color: rgba(240, 240, 240, .77);
      letter-spacing: -.2px;
    }

    .time-panel .value {
      font-size: 15px;
      font-weight: 440;
      color: rgba(255, 255, 255, .93);
      letter-spacing: -.18px;
    }

    .sign-up {
      margin-left: clamp(20px, 1.95vw, 29px);
      width: 109px;
      height: 42px;
      border-radius: 7px;
      background: #fff;
      color: #101010;
      font-size: var(--action-control-font-size);
      font-weight: 460;
      letter-spacing: -.34px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .72),
        0 1px 5px rgba(0, 0, 0, .34);
      position: relative;
      top: var(--control-baseline-shift);
    }

    .menu-toggle {
      display: none;
      margin-left: auto;
      width: 46px;
      height: 46px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, .16);
      background: linear-gradient(145deg, rgba(24, 22, 20, .72), rgba(5, 12, 14, .78));
      box-shadow:
        0 2px 10px rgba(0, 0, 0, .35),
        0 0 0 1px rgba(255, 255, 255, .04) inset;
      backdrop-filter: blur(14px) saturate(108%);
      -webkit-backdrop-filter: blur(14px) saturate(108%);
      align-items: center;
      justify-content: center;
      color: #fff;
      position: relative;
      top: 1px;
    }

    .menu-toggle svg {
      width: 18px;
      height: 18px;
    }

    .menu-toggle .icon-x {
      display: none;
    }

    .header.menu-open .menu-toggle .icon-menu {
      display: none;
    }

    .header.menu-open .menu-toggle .icon-x {
      display: block;
    }

    .hero {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .hero-content,
    .demo-card,
    .primary-cta,
    .watch-button,
    .play {
      pointer-events: auto;
    }

    .hero-content {
      position: absolute;
      left: var(--gutter-start);
      bottom: var(--hero-bottom);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .hero-title {
      margin: 0;
      font-family: "Reference Display", "Reference Sans", Arial, sans-serif;
      font-weight: 500;
      font-optical-sizing: auto;
      font-size: var(--display-size);
      line-height: var(--display-leading);
      letter-spacing: -2.1px;
      -webkit-text-stroke: .12px currentColor;
      white-space: nowrap;
      text-shadow: 0 2px 2px rgba(0, 0, 0, .44);
    }

    .line {
      display: block;
      overflow: hidden;
      transform-origin: left center;
    }

    .line-reveal {
      display: inline-block;
      will-change: transform;
    }

    .line-one {
      color: #fff;
      transform: scaleX(.775);
    }

    .line-two {
      color: rgba(211, 207, 207, .78);
      transform: scaleX(.793);
    }

    .hero-copy {
      margin: var(--title-copy-gap) 0 0;
      width: clamp(390px, 31.67vw, 500px);
      position: relative;
      left: 1px;
      top: var(--copy-optical-shift);
      font-size: var(--copy-size);
      line-height: var(--copy-leading);
      font-weight: 350;
      letter-spacing: .13px;
      color: rgba(226, 229, 228, .84);
      text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
    }

    .primary-cta {
      position: relative;
      margin-top: var(--copy-cta-gap);
      width: var(--cta-width);
      height: var(--cta-height);
      border-radius: 7px;
      background: #fff;
      color: #111;
      box-shadow: 0 1px 5px rgba(0, 0, 0, .38);
    }

    .primary-cta .label {
      position: absolute;
      left: 8.125%;
      top: 50%;
      transform: translateY(calc(-50% + var(--control-baseline-shift)));
      font-size: var(--primary-control-font-size);
      font-weight: 450;
      letter-spacing: -.3px;
      white-space: nowrap;
    }

    .primary-cta .arrow-box {
      position: absolute;
      right: 3.125%;
      top: 14.286%;
      width: 20.625%;
      height: 71.429%;
      border-radius: 7px;
      background: #070909;
      display: grid;
      place-items: center;
    }

    .demo-card {
      position: absolute;
      right: var(--gutter-end);
      bottom: var(--hero-bottom);
      width: var(--card-width);
      aspect-ratio: 201 / 265;
      container-type: inline-size;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: clamp(12px, 1.52vh, 18px);
      background: linear-gradient(145deg, rgba(24, 22, 20, .80), rgba(5, 12, 14, .86));
      box-shadow:
        0 2px 10px rgba(0, 0, 0, .44),
        0 0 0 3px rgba(255, 255, 255, .035) inset,
        0 0 0 1px rgba(0, 0, 0, .9);
      backdrop-filter: blur(14px) saturate(108%);
      -webkit-backdrop-filter: blur(14px) saturate(108%);
      padding: 0;
      overflow: hidden;
      transform-origin: 82% 50%;
    }

    .demo-visual {
      position: absolute;
      left: 3.5cqw;
      top: 4cqw;
      width: 92.5cqw;
      height: 92cqw;
      border-radius: 4cqw;
      background: #101a1e;
      overflow: hidden;
    }

    .demo-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.89) saturate(.93) contrast(1.03);
    }

    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 29cqw;
      height: 29cqw;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .34);
      background: rgba(3, 5, 7, .47);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      color: #fff;
    }

    .play svg {
      width: 34%;
      height: 34%;
      margin-left: 8%;
    }

    .watch-button {
      position: absolute;
      left: 3.5cqw;
      right: 3.5cqw;
      bottom: 4.5cqw;
      height: 18cqw;
      border-radius: 3.8cqw;
      border: 1px solid rgba(255, 255, 255, .21);
      background: linear-gradient(145deg, rgba(26, 34, 36, .86), rgba(16, 29, 33, .9));
      color: rgba(255, 255, 255, .92);
      font-size: clamp(12px, 7.2cqw, 15px);
      font-weight: 430;
      letter-spacing: -.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: var(--watch-baseline-shift);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .04) inset;
    }

    /* Entrance motion */
    @media (prefers-reduced-motion: no-preference) {
      .motion-pending .brand,
      .motion-pending .nav a,
      .motion-pending .time-panel,
      .motion-pending .sign-up,
      .motion-pending .menu-toggle,
      .motion-pending .hero-copy,
      .motion-pending .primary-cta,
      .motion-pending .demo-card {
        opacity: 0;
      }

      .motion-pending .line {
        overflow: hidden;
      }

      .motion-pending .line-reveal {
        transform: translate3d(0, 110%, 0) skewY(2deg);
      }

      .motion-pending .hero-copy {
        transform: translate3d(0, 10px, 0);
      }

      .motion-pending .primary-cta {
        transform: translate3d(0, 8px, 0) scale(.985);
      }

      .motion-pending .demo-card {
        transform: translate3d(0, 12px, 0) scale(.968);
      }

      html:not(.motion-pending) .brand,
      .brand {
        animation: entrance-brand 580ms cubic-bezier(.16, 1, .3, 1) 60ms both;
      }

      html:not(.motion-pending) .nav a:nth-child(1),
      .nav a:nth-child(1) {
        animation: entrance-nav 480ms cubic-bezier(.16, 1, .3, 1) 130ms both;
      }

      html:not(.motion-pending) .nav a:nth-child(2),
      .nav a:nth-child(2) {
        animation: entrance-nav 480ms cubic-bezier(.16, 1, .3, 1) 175ms both;
      }

      html:not(.motion-pending) .nav a:nth-child(3),
      .nav a:nth-child(3) {
        animation: entrance-nav 480ms cubic-bezier(.16, 1, .3, 1) 220ms both;
      }

      html:not(.motion-pending) .nav a:nth-child(4),
      .nav a:nth-child(4) {
        animation: entrance-nav 480ms cubic-bezier(.16, 1, .3, 1) 265ms both;
      }

      html:not(.motion-pending) .time-panel,
      .time-panel {
        animation: entrance-nav 520ms cubic-bezier(.16, 1, .3, 1) 180ms both;
      }

      html:not(.motion-pending) .sign-up,
      .sign-up {
        animation: entrance-action 520ms cubic-bezier(.16, 1, .3, 1) 220ms both;
      }

      html:not(.motion-pending) .menu-toggle,
      .menu-toggle {
        animation: entrance-action 520ms cubic-bezier(.16, 1, .3, 1) 140ms both;
      }

      html:not(.motion-pending) .line-one .line-reveal,
      .line-one .line-reveal {
        animation: entrance-line 800ms cubic-bezier(.22, 1, .36, 1) 300ms both;
      }

      html:not(.motion-pending) .line-two .line-reveal,
      .line-two .line-reveal {
        animation: entrance-line 850ms cubic-bezier(.22, 1, .36, 1) 440ms both;
      }

      html:not(.motion-pending) .hero-copy,
      .hero-copy {
        animation: entrance-copy 620ms cubic-bezier(.16, 1, .3, 1) 740ms both;
      }

      html:not(.motion-pending) .primary-cta,
      .primary-cta {
        animation: entrance-action 560ms cubic-bezier(.16, 1, .3, 1) 960ms both;
      }

      html:not(.motion-pending) .demo-card,
      .demo-card {
        animation: entrance-card 920ms cubic-bezier(.22, 1, .36, 1) 1040ms both;
      }

      button:hover,
      a:hover {
        transition: filter 140ms ease, opacity 140ms ease;
        filter: brightness(1.08);
      }
    }

    @keyframes entrance-brand {
      from {
        opacity: 0;
        transform: translate3d(0, 7px, 0) scale(.94);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes entrance-nav {
      from {
        opacity: 0;
        transform: translate3d(0, 6px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes entrance-action {
      from {
        opacity: 0;
        transform: translate3d(0, 8px, 0) scale(.985);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes entrance-line {
      from {
        transform: translate3d(0, 110%, 0) skewY(2deg);
      }
      to {
        transform: translate3d(0, 0, 0) skewY(0deg);
      }
    }

    @keyframes entrance-copy {
      from {
        opacity: 0;
        transform: translate3d(0, 10px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes entrance-card {
      from {
        opacity: 0;
        transform: translate3d(0, 12px, 0) scale(.968);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    /* Tablet */
    @media (min-width: 620px) and (max-width: 790px),
    (min-width: 620px) and (max-width: 1100px) and (orientation: portrait) {
      .menu-toggle {
        display: inline-flex;
      }

      .header-actions {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        left: auto;
        width: min(324px, calc(100vw - (var(--gutter-start) + var(--gutter-end))));
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        padding: 18px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, .14);
        background: linear-gradient(145deg, rgba(24, 22, 20, .88), rgba(5, 12, 14, .92));
        box-shadow:
          0 12px 40px rgba(0, 0, 0, .45),
          0 0 0 1px rgba(255, 255, 255, .04) inset;
        backdrop-filter: blur(18px) saturate(110%);
        -webkit-backdrop-filter: blur(18px) saturate(110%);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        pointer-events: none;
        transition: opacity 180ms ease, transform 180ms ease, visibility 180ms;
        white-space: normal;
      }

      .header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      .nav {
        margin: 0;
        top: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .nav a:first-child,
      .nav a:nth-child(4) {
        top: 0;
        margin-left: 0;
      }

      .nav a.active::after {
        left: 0;
        transform: none;
        bottom: -4px;
      }

      .time-panel {
        margin: 8px 0 0;
        width: 100%;
        height: auto;
        padding: 10px 0 0 8px;
      }

      .sign-up {
        margin: 4px 0 0;
        width: 100%;
      }

      .hero-copy {
        width: min(500px, calc(100vw - var(--gutter-start) - var(--gutter-end) - 24px));
      }
    }

    /* Mobile */
    @media (max-width: 619px) {
      .screen {
        --mobile-gutter: max(20px, env(safe-area-inset-left));
        --gutter-start: var(--mobile-gutter);
        --gutter-end: max(20px, env(safe-area-inset-right));
        --hero-bottom: max(28px, env(safe-area-inset-bottom));
        --display-size: clamp(42px, 8.2vw, 54px);
        --display-leading: clamp(52px, 10vw, 66px);
        --copy-size: 15px;
        --copy-leading: 21px;
        --card-width: clamp(132px, 38vw, 168px);
      }

      .menu-toggle {
        display: inline-flex;
      }

      .header-actions {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        width: min(340px, calc(100vw - (var(--gutter-start) + var(--gutter-end))));
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, .14);
        background: linear-gradient(145deg, rgba(24, 22, 20, .9), rgba(5, 12, 14, .94));
        box-shadow: 0 12px 40px rgba(0, 0, 0, .5);
        backdrop-filter: blur(18px) saturate(110%);
        -webkit-backdrop-filter: blur(18px) saturate(110%);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        pointer-events: none;
        transition: opacity 180ms ease, transform 180ms ease, visibility 180ms;
        white-space: normal;
      }

      .header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: none;
        pointer-events: auto;
      }

      .nav {
        margin: 0;
        top: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .nav a:first-child,
      .nav a:nth-child(4) {
        top: 0;
        margin-left: 0;
      }

      .time-panel {
        margin: 8px 0 0;
        width: 100%;
        height: auto;
        padding: 10px 0 0 8px;
      }

      .sign-up {
        margin: 4px 0 0;
        width: 100%;
      }

      .line-one {
        transform: scaleX(.78);
      }

      .line-two {
        transform: scaleX(.55);
      }

      .hero-copy {
        width: min(420px, calc(100vw - var(--gutter-start) - var(--gutter-end)));
      }

      .hero-copy br {
        display: none;
      }

      .demo-card {
        top: clamp(176px, 32svh, 300px);
        bottom: auto;
      }
    }

    @media (max-width: 619px) and (max-height: 700px) {
      .demo-card {
        top: clamp(140px, 26svh, 220px);
        --card-width: clamp(120px, 34vw, 148px);
      }

      .hero-title {
        font-size: clamp(36px, 7.4vw, 46px);
        line-height: 1.15;
      }
    }

    @media (max-width: 900px) and (orientation: landscape) and (max-height: 480px) {
      .demo-card {
        display: none;
      }

      .hero-content {
        bottom: 18px;
      }

      .hero-title {
        font-size: 36px;
        line-height: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand,
      .nav a,
      .time-panel,
      .sign-up,
      .menu-toggle,
      .line-reveal,
      .hero-copy,
      .primary-cta,
      .demo-card {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

    <section class="screen" id="screen">
      <video class="background" autoplay muted loop playsinline disablepictureinpicture aria-hidden="true">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_064556_051587f1-74a1-4336-8c05-4dde3594ed05.mp4" type="video/mp4">
      </video>

      <header class="header" id="site-header">
        <a class="brand" href="#" aria-label="Vantage home">
          <svg viewBox="0 0 25 25" width="25" height="25" aria-hidden="true">
            <defs>
              <clipPath id="brand-clip">
                <circle cx="12.5" cy="12.5" r="12.5" />
              </clipPath>
            </defs>
            <g clip-path="url(#brand-clip)">
              <circle cx="12.5" cy="12.5" r="12.5" fill="#ededed" />

              <path fill="#0a0b0b" d="M11.2 14.6h2.6l-1.3-2.4-1.3 2.4Z" />
            </g>
          </svg>
        </a>

        <div class="header-actions" id="tablet-navigation">
          <nav class="nav" aria-label="Primary">
            <a class="active" href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
          </nav>

          <div class="time-panel">
            <div class="label">Timezone</div>

          <button class="sign-up" type="button">Sign Up</button>

        <button
          class="menu-toggle"
          type="button"
          id="menu-toggle"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="tablet-navigation"
        >
          <svg class="icon-menu" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M3 6h12M3 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <svg class="icon-x" viewBox="0 0 18 18" fill="none" aria-hidden="true">

        </button>

              <svg viewBox="0 0 12 14" fill="none" aria-hidden="true">

  <script>
    (function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) {
        document.documentElement.classList.remove("motion-pending");
        if (window.__vantageMotionFallback) window.clearTimeout(window.__vantageMotionFallback);
      }

      var card = document.getElementById("demo-card");
      function clearPending() {
        document.documentElement.classList.remove("motion-pending");
        if (window.__vantageMotionFallback) {
          window.clearTimeout(window.__vantageMotionFallback);
          window.__vantageMotionFallback = null;
        }
      }

      if (card && !reduce) {
        card.addEventListener("animationend", function onEnd(event) {
          if (event.animationName !== "entrance-card") return;
          card.removeEventListener("animationend", onEnd);
          clearPending();
        });
      } else {
        clearPending();
      }

      var header = document.getElementById("site-header");
      var toggle = document.getElementById("menu-toggle");
      var panel = document.getElementById("tablet-navigation");
      if (!header || !toggle || !panel) return;

      function menuToggleVisible() {
        return window.getComputedStyle(toggle).display !== "none";
      }

      function setOpen(open) {
        header.classList.toggle("menu-open", open);
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
        if (menuToggleVisible()) {
          if (open) {
            panel.removeAttribute("inert");
            var first = panel.querySelector("a, button");
            if (first) first.focus();
          } else {
            panel.setAttribute("inert", "");
          }
        } else {
          panel.removeAttribute("inert");
        }
      }

      function syncInert() {
        if (menuToggleVisible()) {
          if (!header.classList.contains("menu-open")) panel.setAttribute("inert", "");
        } else {
          panel.removeAttribute("inert");
          header.classList.remove("menu-open");
          toggle.setAttribute("aria-expanded", "false");
        }
      }

      syncInert();
      window.addEventListener("resize", syncInert);

      toggle.addEventListener("click", function () {
        setOpen(!header.classList.contains("menu-open"));
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") setOpen(false);
      });

      document.addEventListener("pointerdown", function (event) {
        if (!header.classList.contains("menu-open")) return;
        if (header.contains(event.target)) return;
        setOpen(false);
      });

      panel.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
          setOpen(false);
        });
      });
    })();
  </script>
